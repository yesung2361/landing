<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>앱 화면</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
/* 랜딩 히어로용 앱 화면 — 데스크톱 1.0 시안(docs/design/comps/v1, 10-14 확정)의 홈 화면을 그대로 옮긴 것. 시안이 바뀌면 같이 바꾼다 */
:root{--font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI","Malgun Gothic",sans-serif}
html,body{margin:0;width:1440px;height:900px;overflow:hidden;background:transparent}
body>#cam,#cam>.app{width:1440px;height:900px}
#cam{transform-origin:0 0;will-change:transform}
/* ═════════ 제품 디자인 시스템 (.app 안) ═════════ */
.app{
  --bg:#f7f8fa; --s1:#fff; --s2:#f2f4f6; --s3:#e9ecef; --line:#e5e8eb; --line2:#d1d6db;
  --t1:#191f28; --t2:#4e5968; --t3:#8b95a1; --t4:#b0b8c1;
  --brand:#2f6bff; --brand-h:#1f5cf0; --brand-s:#edf2ff; --brand-t:#1f57d6;
  --ok:#0e9f5c; --ok-s:#e7f6ee; --warn:#e07400; --warn-s:#fff3e3; --bad:#e5484d; --bad-s:#fdeced;
  --r-s:6px; --r-m:8px; --r-l:12px; --r-xl:16px;
  --sh-1:0 1px 2px rgba(16,24,40,.04); --sh-pop:0 20px 48px -16px rgba(16,24,40,.28),0 0 0 1px rgba(16,24,40,.06);
  font-family:var(--font); font-size:14px; line-height:1.45; color:var(--t1); background:var(--bg); letter-spacing:-.01em;
  display:flex; flex-direction:column; overflow:hidden; word-break:keep-all; font-feature-settings:"tnum" 0;
}
.app.dark{
  --bg:#0f1012; --s1:#17181c; --s2:#1f2126; --s3:#272a30; --line:#26292f; --line2:#363a41;
  --t1:#f2f4f6; --t2:#b0b8c1; --t3:#7b8794; --t4:#4e5968;
  --brand:#4c7dff; --brand-h:#6a92ff; --brand-s:rgba(76,125,255,.15); --brand-t:#8eb0ff;
  --ok:#2fc27a; --ok-s:rgba(47,194,122,.14); --warn:#ff9d3d; --warn-s:rgba(255,157,61,.14); --bad:#ff6369; --bad-s:rgba(255,99,105,.14);
  --sh-pop:0 24px 56px -16px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06);
}
.app *{box-sizing:border-box}
.app svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app .num{font-variant-numeric:tabular-nums}
/* 창 머리 — Windows 11 */
.app .wt{height:32px;flex:none;display:flex;align-items:center;font-size:12px;color:var(--t2);padding-left:12px;gap:8px}
.app .wt .lg{width:16px;height:16px;border-radius:4px;background:linear-gradient(140deg,#4c84ff,#2457e6);display:grid;place-items:center}
.app .wt .lg::after{content:"";width:6px;height:6px;border-radius:2px;background:#fff}
.app .wt .cap{margin-left:auto;display:flex;height:100%}
.app .wt .cap span{width:46px;display:grid;place-items:center;position:relative;color:var(--t2)}
.app .wt .cap span::before{content:"";width:10px;height:1px;background:currentColor}
.app .wt .cap span:nth-child(2)::before{width:9px;height:9px;background:none;border:1px solid currentColor;border-radius:2px}
.app .wt .cap span:nth-child(3)::before,.app .wt .cap span:nth-child(3)::after{content:"";position:absolute;width:12px;height:1px;background:currentColor;transform:rotate(45deg)}
.app .wt .cap span:nth-child(3)::after{transform:rotate(-45deg)}
.app .body{flex:1;min-height:0;display:grid;grid-template-columns:224px 1fr;position:relative}
/* 사이드바 */
.app .sb{display:flex;flex-direction:column;padding:6px 10px 12px;min-height:0}
.app .ni{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:var(--r-m);color:var(--t2);font-weight:500;font-size:14px}
.app .ni svg{color:var(--t3)}
.app .ni.on{background:var(--s1);color:var(--t1);font-weight:600;box-shadow:var(--sh-1),0 0 0 1px var(--line)}
.app .ni.on svg{color:var(--brand)}
.app .ni .ct{margin-left:auto;font-size:12px;color:var(--t3);font-weight:500}
.app .ni .ct.hot{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:11.5px}
.app .sbh{font-size:12px;font-weight:600;color:var(--t3);padding:18px 10px 6px;display:flex;justify-content:space-between}
.app .rm{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:var(--r-m);color:var(--t2);font-size:13.5px}
.app .rm i{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-style:normal;font-size:10.5px;font-weight:700;color:#fff;background:#8f99a6;flex:none}
.app .rm em{margin-left:auto;font-style:normal;font-size:12px;color:var(--t3)}
.app .sbf{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.app .conn{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--r-l);background:var(--s1);box-shadow:0 0 0 1px var(--line);font-size:12.5px;color:var(--t2)}
.app .conn i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 3px var(--ok-s)}
.app .conn b{color:var(--t1);font-weight:600}
.app .me{display:flex;align-items:center;gap:10px;padding:6px 6px 0 10px}
.app .me .av{width:30px;height:30px;font-size:12px}
.app .me div{flex:1;line-height:1.3}.app .me b{font-size:13.5px;display:block}.app .me small{font-size:12px;color:var(--t3)}
.app .me svg{color:var(--t3)}
/* 본문 판 */
.app .main{margin:0 8px 8px 0;background:var(--s1);border-radius:var(--r-l);box-shadow:0 0 0 1px var(--line),var(--sh-1);min-width:0;min-height:0;overflow:hidden;display:grid}
.app .main.split{grid-template-columns:468px 1fr}
.app .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:12.5px;background:linear-gradient(160deg,#a3acb9,#7d8794);flex:none}
/* 목록 */
.app .lp{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.app .lh{padding:20px 20px 12px;display:flex;align-items:flex-start;gap:10px}
.app .lh h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1.2}
.app .lh small{display:block;font-size:13px;color:var(--t3);margin-top:3px}
.app .ib{width:32px;height:32px;border-radius:var(--r-m);display:grid;place-items:center;color:var(--t2)}
.app .ib:hover{background:var(--s2)}
.app .chips{display:flex;gap:6px;padding:0 20px 12px;border-bottom:1px solid var(--line)}
.app .chip{height:30px;padding:0 12px;border-radius:15px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--t2);background:var(--s2)}
.app .chip b{font-weight:600;color:var(--t3);font-size:12.5px}
.app .chip.on{background:var(--t1);color:var(--s1)}.app .chip.on b{color:var(--t4)}
.app.dark .chip.on{background:var(--t1);color:#0f1012}
.app .gh{display:flex;align-items:center;gap:6px;padding:14px 20px 6px;font-size:12.5px;font-weight:600;color:var(--t3)}
.app .gh b{color:var(--t2)}
.app .row{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;margin:0 8px;border-radius:var(--r-l);position:relative}
.app .row:hover{background:var(--s2)}
.app .row.on{background:var(--brand-s)}
.app .row .lead{width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.app .row .lead svg{width:18px;height:18px}
.app .row b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app .row small{display:block;font-size:12.5px;color:var(--t3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app .row .due{text-align:right;font-size:12.5px;color:var(--t3);line-height:1.35}
.app .row .due b{font-size:13px;color:var(--t2);font-weight:600}
.app .row .due.hot b{color:var(--bad)}.app .row .due.hot small{color:var(--bad)}
.app .row .pr{display:flex;gap:3px;margin-top:6px;width:120px}.app .row .pr i{flex:1;height:3px;border-radius:2px;background:var(--s3)}.app .row .pr i.on{background:var(--brand)}
.app .ft{display:inline-grid;place-items:center;height:18px;padding:0 5px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.02em;color:#fff;flex:none}
.app .ft.xlsx{background:#1d7a45}.app .ft.pptx{background:#c94a24}.app .ft.hwpx{background:#2b6fd6}.app .ft.docx{background:#2459c4}
.app .lead.file{background:var(--s2)}
/* 상세 */
.app .dp{display:flex;flex-direction:column;min-width:0;min-height:0}
.app .dh{padding:18px 24px 0;display:flex;align-items:flex-start;gap:12px}
.app .dh .crumb{font-size:12.5px;color:var(--t3);display:flex;gap:6px;align-items:center}
.app .dh h2{margin:4px 0 0;font-size:19px;font-weight:700;letter-spacing:-.025em;display:flex;align-items:center;gap:8px}
.app .sp{flex:1}
.app .badge{height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.app .badge.brand{background:var(--brand-s);color:var(--brand-t)}.app .badge.ok{background:var(--ok-s);color:var(--ok)}.app .badge.warn{background:var(--warn-s);color:var(--warn)}.app .badge.bad{background:var(--bad-s);color:var(--bad)}.app .badge.n{background:var(--s2);color:var(--t2)}
.app .btn{height:34px;padding:0 14px;border-radius:var(--r-m);font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;background:var(--s1);color:var(--t1);box-shadow:inset 0 0 0 1px var(--line2);white-space:nowrap;flex:none}
.app .btn svg{width:16px;height:16px}
.app .btn.pri{background:var(--brand);color:#fff;box-shadow:none}
.app .btn.lg{height:44px;padding:0 20px;font-size:15px;border-radius:10px}
.app .btn.gh2{box-shadow:none;background:transparent;color:var(--t2)}
.app .tabs{display:flex;gap:22px;padding:0 24px;margin-top:14px;border-bottom:1px solid var(--line)}
.app .tabs span{padding:10px 0 11px;font-size:13.5px;font-weight:500;color:var(--t3);display:flex;gap:6px;align-items:center}
.app .tabs span.on{color:var(--t1);font-weight:600;box-shadow:inset 0 -2px 0 var(--t1)}
.app .tabs span em{font-style:normal;font-size:12px;color:var(--ok);font-weight:600}
.app .tray{flex:1;min-height:0;margin:16px 24px 0;border-radius:var(--r-l);background:var(--s2);overflow:hidden;position:relative;display:flex;justify-content:center;padding:22px 22px 0}
.app.dark .tray{background:#0c0d10}
.app .df{padding:12px 24px 16px;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--t3)}
.app .df svg{color:var(--brand);width:16px;height:16px}
.app .df b{color:var(--t2);font-weight:500}
.app .df a{margin-left:auto;color:var(--brand-t);font-weight:600;display:flex;gap:4px;align-items:center;text-decoration:none}
/* 엑셀 미리보기 */
.app .xl{background:#fff;color:#1f2329;box-shadow:0 1px 2px rgba(0,0,0,.06),0 18px 40px -22px rgba(0,0,0,.35);border-radius:4px;overflow:hidden;font-size:12px;align-self:flex-start}
.app .xl table{border-collapse:collapse;table-layout:fixed;color:inherit;font-size:inherit}
.app .xl td,.app .xl th{border:1px solid #e3e6ea;height:24px;padding:0 8px;white-space:nowrap;overflow:hidden}
.app .xl .ch th{background:#f3f5f7;color:#8a929c;font-weight:500;font-size:11px;text-align:center;height:22px}
.app .xl .rn{background:#f3f5f7;color:#8a929c;font-size:11px;text-align:center;width:34px;padding:0}
.app .xl .r{text-align:right;font-variant-numeric:tabular-nums}
.app .xl .ttl td.t{font-size:18px;font-weight:700;letter-spacing:.6em;text-align:center;height:40px;border-color:#e3e6ea}
.app .xl .hd td{background:#eaf3ee;font-weight:700;color:#1d5e3b;text-align:center}
.app .xl .lab{color:#6b7480}
.app .xl .sum td{font-weight:600}
.app .xl .tot td{font-weight:700;background:#fff8e1}
.app .xl .stabs{display:flex;gap:2px;background:#f3f5f7;border-top:1px solid #e3e6ea;padding:0 0 0 34px;font-size:11.5px;color:#6b7480}
.app .xl .stabs span{padding:5px 14px}
.app .xl .stabs span.on{background:#fff;color:#1d7a45;font-weight:600;box-shadow:inset 0 -2px 0 #1d7a45}
/* A4 문서 */
.app .a4{width:600px;flex:none;background:#fff;color:#1b1d21;box-shadow:0 1px 2px rgba(0,0,0,.06),0 18px 40px -22px rgba(0,0,0,.35);padding:52px 60px;font-size:12.5px;line-height:1.85;align-self:flex-start;position:relative}
.app .a4 .org{text-align:center;font-size:20px;font-weight:700;letter-spacing:.2em;margin-bottom:22px}
.app .a4 .kv{display:grid;grid-template-columns:52px 1fr;gap:2px 10px}
.app .a4 .kv b{font-weight:600;letter-spacing:.3em}
.app .a4 hr{border:0;border-top:2px solid #1b1d21;margin:14px 0 16px}
.app .a4 p{margin:0 0 4px}
.app .a4 .ind{padding-left:16px}
.app .a4 .end{margin-top:14px}
.app .a4 .sig{margin-top:30px;text-align:center;font-size:17px;font-weight:700;letter-spacing:.25em}
.app .a4 .foot{margin-top:28px;border-top:1px solid #c9ccd1;padding-top:8px;font-size:11px;color:#555;display:grid;grid-template-columns:1fr 1fr;gap:2px 16px}
.app .lasso{position:absolute;border:1.5px dashed var(--brand);border-radius:6px;background:rgba(47,107,255,.07)}
.app .lasso span{position:absolute;right:-1px;top:-24px;height:20px;padding:0 8px;border-radius:5px;background:var(--brand);color:#fff;font-size:11.5px;font-weight:600;display:flex;align-items:center;white-space:nowrap}
/* 슬라이드 */
.app .sl{width:640px;aspect-ratio:16/9;background:#fff;color:#191f28;box-shadow:0 1px 2px rgba(0,0,0,.06),0 18px 40px -22px rgba(0,0,0,.35);border-radius:4px;padding:30px 36px;display:flex;flex-direction:column;flex:none}
.app .sl .k{font-size:11px;font-weight:700;color:#2f6bff;letter-spacing:.04em}
.app .sl h4{margin:6px 0 0;font-size:22px;letter-spacing:-.03em;line-height:1.25}
.app .sl .ch{flex:1;display:flex;align-items:flex-end;gap:26px;padding:16px 10px 0;border-bottom:1px solid #d6dbe1;margin-top:10px}
.app .sl .ch div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%}
.app .sl .ch b{font-size:11.5px;font-variant-numeric:tabular-nums}
.app .sl .ch i{width:100%;max-width:64px;border-radius:4px 4px 0 0;background:#c9d6ff;display:block}
.app .sl .ch i.cur{background:#2f6bff}
.app .sl .lb{display:flex;gap:26px;padding:6px 10px 0}.app .sl .lb span{flex:1;text-align:center;font-size:11px;color:#6b7684}
.app .sl .src{font-size:10px;color:#9aa2ab;margin-top:8px}
.app .req .sl{width:100%}
.app .thumbs{display:flex;gap:10px;padding:14px 0 0;width:640px}
.app .thumbs div{flex:1;aspect-ratio:16/9;border-radius:4px;background:#fff;box-shadow:0 0 0 1px var(--line)}
.app .thumbs div.on{box-shadow:0 0 0 2px var(--brand)}
.app .thumbs div{position:relative}
.app .thumbs div::before{content:"";position:absolute;left:10%;top:16%;width:55%;height:9%;background:#d3d8de;border-radius:2px}
.app .thumbs div::after{content:attr(data-n);position:absolute;right:6px;bottom:4px;font-size:10px;color:#9aa2ab}
/* 대화(고치기) */
.app .rv{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.app .rv .rh{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.app .rv .rh b{font-size:15px}.app .rv .rh small{display:block;color:var(--t3);font-size:12.5px;margin-top:2px}
.app .msgs{flex:1;min-height:0;padding:16px 18px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.app .mu{align-self:flex-end;max-width:86%;background:var(--brand);color:#fff;border-radius:14px 14px 4px 14px;padding:9px 12px;font-size:13.5px;line-height:1.5}
.app .mu .sel{display:inline-flex;margin-bottom:5px;font-size:11.5px;font-weight:600;background:rgba(255,255,255,.2);padding:1px 7px;border-radius:5px}
.app .ma{max-width:94%;font-size:13.5px;line-height:1.55;color:var(--t1)}
.app .ma .who{font-size:12px;font-weight:600;color:var(--t3);margin-bottom:5px;display:flex;align-items:center;gap:6px}
.app .ma .who i{width:16px;height:16px;border-radius:5px;background:linear-gradient(140deg,#4c84ff,#2457e6);display:block}
.app .opts{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.app .opt{height:38px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line2);display:flex;align-items:center;padding:0 12px;font-size:13.5px;font-weight:500;gap:8px}
.app .opt.on{box-shadow:inset 0 0 0 1.5px var(--brand);background:var(--brand-s);color:var(--brand-t);font-weight:600}
.app .opt kbd{margin-left:auto;font:inherit;font-size:11px;color:var(--t3);background:var(--s2);border-radius:4px;padding:1px 6px}
.app .note{margin-top:10px;border-radius:12px;background:var(--s2);padding:12px 14px;font-size:13px;line-height:1.5}
.app .note b{display:block;margin-bottom:8px}
.app .comp{margin:0 14px 14px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line2);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.app .comp .tg{display:flex;gap:6px}
.app .comp .tg span{font-size:12px;font-weight:600;color:var(--brand-t);background:var(--brand-s);border-radius:6px;padding:2px 8px}
.app .comp .in{color:var(--t3);font-size:13.5px}
.app .comp .bot{display:flex;align-items:center;gap:8px}
.app .comp .seg{display:flex;padding:2px;border-radius:8px;background:var(--s2);font-size:12px}
.app .comp .seg span{padding:3px 10px;border-radius:6px;color:var(--t2);font-weight:500}.app .comp .seg span.on{background:var(--s1);color:var(--t1);font-weight:600;box-shadow:var(--sh-1)}
.app .comp .go{margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center}
/* 원문 근거 */
.app .src2{display:grid;grid-template-columns:1fr 1fr;min-height:0}
.app .thread{padding:18px 24px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:14px;overflow:hidden;background:var(--s2)}
.app.dark .thread{background:#121317}
.app .thread .day{align-self:center;font-size:12px;color:var(--t3);background:var(--s1);border-radius:999px;padding:3px 12px;box-shadow:0 0 0 1px var(--line)}
.app .km{display:flex;gap:10px;align-items:flex-start}
.app .km .av{width:34px;height:34px;border-radius:12px;font-size:12px}
.app .km .nm{font-size:12px;color:var(--t2);margin-bottom:4px}
.app .km .bb{background:var(--s1);border-radius:4px 14px 14px 14px;padding:9px 12px;font-size:13.5px;line-height:1.55;box-shadow:0 0 0 1px var(--line);max-width:400px}
.app .km .tm{font-size:11px;color:var(--t3);align-self:flex-end}
.app mark{background:rgba(47,107,255,.14);color:inherit;border-radius:3px;padding:0 2px;box-shadow:inset 0 -1.5px 0 var(--brand)}
.app.dark mark{background:rgba(76,125,255,.22)}
.app sup.mk{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--brand);color:#fff;font-size:10px;font-weight:700;margin-left:2px;vertical-align:2px}
.app .req{padding:18px 24px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.app .req h4{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:8px}
.app .rq{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;box-shadow:0 0 0 1px var(--line)}
.app .rq .mk2{width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center}
.app .rq b{font-size:14px;font-weight:600;display:block}
.app .rq small{display:block;font-size:12.5px;color:var(--t3);margin-top:3px}
.app .rq .ok{font-size:12px;font-weight:600;color:var(--ok);display:flex;align-items:center;gap:4px}
.app .rq .ok svg{width:14px;height:14px}
/* 시트(승인) */
.app .scrim{position:absolute;inset:0;background:rgba(16,18,24,.32);display:grid;place-items:center;z-index:5}
.app .sheet{width:520px;background:var(--s1);border-radius:18px;box-shadow:var(--sh-pop);padding:24px;display:flex;flex-direction:column;gap:16px}
.app .sheet h3{margin:0;font-size:20px;letter-spacing:-.03em}
.app .sheet .sub{margin:-8px 0 0;color:var(--t3);font-size:13.5px}
.app .to{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--s2)}
.app .to .av{border-radius:10px}
.app .to b{font-size:14px;display:block}.app .to small{font-size:12.5px;color:var(--t3)}
.app .to .chg{margin-left:auto;font-size:13px;font-weight:600;color:var(--brand-t)}
.app .lbl{font-size:12.5px;font-weight:600;color:var(--t3);margin-bottom:6px}
.app .ta{border-radius:12px;box-shadow:inset 0 0 0 1px var(--line2);padding:12px 14px;font-size:14px;line-height:1.6}
.app .att{display:flex;align-items:center;gap:10px;margin-top:8px;padding:10px 12px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line)}
.app .att b{font-size:13.5px;display:block}.app .att small{font-size:12px;color:var(--t3)}
.app .att .pv{margin-left:auto;font-size:13px;font-weight:600;color:var(--brand-t)}
.app .cb{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.app .cb i{width:18px;height:18px;border-radius:5px;box-shadow:inset 0 0 0 1.5px var(--line2);flex:none;margin-top:1px}
.app .cb small{display:block;color:var(--t3);font-size:12.5px;margin-top:2px}
.app .sbtn{display:grid;grid-template-columns:1fr 1.6fr;gap:8px}
.app .sbtn span{height:48px;border-radius:12px;display:grid;place-items:center;font-size:15px;font-weight:600;background:var(--s2);color:var(--t1)}
.app .sbtn span.pri{background:var(--brand);color:#fff}
/* 맥 */
.app.mac .wt{display:none}
.app.mac{background:linear-gradient(160deg,#dfe6f2,#e9ecf2 40%,#efe9e6)}
.app.mac .sb{background:rgba(255,255,255,.45);margin:8px 0 8px 8px;border-radius:16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),0 12px 30px -18px rgba(20,30,60,.35);padding-top:14px;backdrop-filter:blur(30px)}
.app.mac .main{margin:8px 8px 8px 10px}
.app.mac .lights{display:flex;gap:8px;padding:2px 10px 16px}.app.mac .lights i{width:12px;height:12px;border-radius:50%;background:#ff5f57}.app.mac .lights i:nth-child(2){background:#febc2e}.app.mac .lights i:nth-child(3){background:#28c840}
.app .lights{display:none}
.app.mac .ni.on{background:rgba(255,255,255,.75)}
/* ── 랜딩 장면: 카톡 요청 감지 → 만드는 중 → 검증 3/3 → 결과물 열림 (반복) ── */
body{user-select:none;pointer-events:none}
.app .toast{position:absolute;z-index:9;top:46px;right:18px;width:380px;padding:14px 16px;border-radius:var(--r-l);background:var(--s1);box-shadow:var(--sh-pop);opacity:0}
.app .toast .tt{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--brand-t)}
.app .toast .tt svg{width:15px;height:15px}
.app .toast .tq{margin-top:6px;font-size:14px;line-height:1.5;font-weight:500}
.app .toast .tq small{display:block;font-size:12px;color:var(--t3);font-weight:400;margin-bottom:2px}
.app #nr{overflow:hidden}

.cap{position:fixed;left:50%;bottom:36px;z-index:20;display:flex;align-items:center;gap:12px;padding:14px 22px 14px 14px;border-radius:16px;background:#fff;color:#191f28;

.cap i{font-style:normal;width:34px;height:34px;border-radius:50%;background:#2f6bff;color:#fff;display:grid;place-items:center;font-size:17px}
.app #nr .pr i{transition:background .25s}
.app #nr .st{display:block;font-size:12px;color:var(--t3);margin-top:4px}
.app #nr .st b{display:inline;font-size:12px;color:var(--brand-t);font-weight:600}
.app .dp .tray .xl tr{transition:opacity .2s}

  const capEl = document.getElementById('cap')
  let capNow = -1
  tl.eventCallback('onUpdate', () => { const t = tl.time()
    setV(t < 2.7 ? 0 : t < 3.0 ? 1 : t < 3.3 ? 2 : 3); nr.classList.toggle('on', t >= 3.7)
    let i = 0; CAP.forEach(([at], k) => { if (t >= at) i = k })
    if (i !== capNow) { capNow = i; const txt = CAP[i][1]
      if (txt) { document.getElementById('capt').textContent = txt; document.getElementById('capn').textContent = i }
      gsap.to(capEl, { opacity: txt ? 1 : 0, y: txt ? 0 : 10, duration: .25, overwrite: true }) } })
  tl.set(nr, { height: 0, paddingTop: 0, paddingBottom: 0, opacity: 0 }).set(due, { opacity: 0 }).set(dp, { opacity: 0, x: 24 }).set(xrows, { opacity: 0 })
    .set('#spot', { left: 1042, top: 46, width: 380, height: 92, opacity: 0 }).set(cam, { cx: 720, cy: 450, k: 1, onComplete: drawCam })
  // ① 요청 감지 — 알림을 확대
  tl.fromTo('#toast', { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: .45, ease: 'power3.out' }, .2)
  look(1150, 160, 1.9, .3); lit(1036, 40, 392, 104, .3, .5)
  tl.to('#toast', { opacity: 0, y: -10, duration: .35, ease: 'power2.in' }, 1.6)
  // ② 할 일 등장 → ③ 검증 막대 — 목록 줄을 확대
  look(460, 250, 1.75, 1.6, .8); lit(228, 189, 459, 82, 1.6, .8)
  tl.to(nr, { height: 'auto', paddingTop: 10, paddingBottom: 10, opacity: 1, duration: .5, ease: 'power3.out' }, 2.0)
    .to(due, { opacity: 1, duration: .3 }, 3.3)
  // ④ 결과물 — 견적서로 이동
  look(1060, 470, 1.3, 3.6, .9); lit(712, 150, 700, 700, 3.6, .9)
  tl.to(dp, { opacity: 1, x: 0, duration: .5, ease: 'power3.out' }, 3.8)
    .to(xrows, { opacity: 1, duration: .15, stagger: .06 }, 4.1)
  // 마무리 — 한 발 물러나 앱 전체
  look(720, 450, 1, 5.3, .8); tl.to('#spot', { opacity: 0, duration: .5 }, 5.3)
  tl.to({}, { duration: .5 })
} else setV(3)
addEventListener('message', e => { if (tl && typeof e.data?.p === 'number') tl.progress(e.data.p) })
if (tl && q.get('at')) tl.seek(+q.get('at'), false) // 점검용: 장면 n초 지점에 멈춤
else if (tl && parent === window) { tl.eventCallback('onComplete', () => setTimeout(() => tl.restart(), 2500)); tl.play() }
</script>
</body>
